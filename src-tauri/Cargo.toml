[package]
name = "spike"
version = "0.1.0"
description = "Cross-platform CI spike: a minimal Tauri 2 app with real-shell, browser and installer tests on six GitHub runners"
authors = ["itsdanielyc"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WebdriverIO support. `tauri-plugin-wdio` gives tests execute/mock/log access;
# `tauri-plugin-wdio-webdriver` is the embedded WebDriver server that the
# default `embedded` provider connects to. It is registered only in debug
# builds (see lib.rs), so release binaries never start a WebDriver server.
tauri-plugin-wdio = "1"
tauri-plugin-wdio-webdriver = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
