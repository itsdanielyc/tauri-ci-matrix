# Regenerates the per-OS pixel baselines (and the shared ARIA and geometry
# snapshots) on the runners themselves, then opens a pull request with the
# result. Baselines are never captured on a developer machine: a Windows
# laptop cannot produce a macOS baseline, and runner fonts and GPUs differ.
name: snapshots

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    name: capture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Capture baselines
        env:
          CI: "1"
        run: npm run test:ui:update
      - uses: actions/upload-artifact@v7
        with:
          name: snapshots-${{ matrix.os }}
          path: tests/ui/__snapshots__
          retention-days: 3

  propose:
    name: open pull request
    needs: [capture]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: snapshots-*
          path: incoming
      - name: Merge the three capture sets
        run: |
          for d in incoming/snapshots-*; do cp -R "$d"/. tests/ui/__snapshots__/; done
          git status --short tests/ui/__snapshots__
      - name: Commit and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard tests/ui/__snapshots__)" ]; then
            echo "No snapshot changes."; exit 0
          fi
          branch="snapshots/update-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add tests/ui/__snapshots__
          git commit -m "Update visual snapshots from run ${{ github.run_id }}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Update visual snapshots (run ${{ github.run_id }})" \
            --body "Baselines captured on ubuntu-latest, windows-latest and macos-latest by the snapshots workflow. Review the images before merging."
