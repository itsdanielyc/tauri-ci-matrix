# L7: release bundles on the three OS families, installed and launched the
# way a user would. Costs a release build per OS, so it runs on main and on
# demand, not on every pull request.
name: installers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installers:
    name: installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Rust toolchain
        shell: bash
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          cache-bin: false
          key: release
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config patchelf \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev xvfb libfuse2t64
      - run: npm ci
      - name: Build release bundles
        run: npm run tauri build
      - name: Start Xvfb
        if: runner.os == 'Linux'
        run: |
          nohup Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          for _ in $(seq 1 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Install, launch, uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/installer-test.ps1
      - name: Install, launch, uninstall (macOS, Linux)
        if: runner.os != 'Windows'
        run: bash scripts/installer-test.sh
      - name: Upload bundles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 7
