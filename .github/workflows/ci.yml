# Main workflow, in tiers of cost:
#   unit  (1 Linux job)       L1/L2: Vitest, mock-vs-contract conformance.
#   ui    (3 OS runners)      L4/L5: Playwright on chromium + webkit against the
#                             Vite dev server and the labelled mock; ARIA, layout
#                             geometry and per-OS pixel snapshots.
#   e2e   (6 OS runners)      L6: debug binary driven through the embedded
#                             WebDriver provider, including macOS; a screenshot
#                             named after the OS and CPU the app reported.
#   sheet (1 Linux job)       Collects every screenshot into one HTML contact
#                             sheet so a developer on one OS can see all of them.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Type-check the suites
        run: npx tsc -p tests/e2e/tsconfig.json --noEmit

  ui:
    name: ui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright browsers
        # Ubuntu's apt can stall on a service-restart prompt during
        # --with-deps; keep it non-interactive and bound each attempt.
        timeout-minutes: 12
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          bound=""; command -v timeout >/dev/null && bound="timeout 420"   # macOS has no timeout(1)
          for attempt in 1 2; do
            $bound npx playwright install --with-deps chromium webkit && exit 0
            echo "attempt $attempt failed or stalled; retrying"
          done
          exit 1
      - name: Playwright (chromium + webkit, against the mock)
        env:
          CI: "1"
        run: npm run test:ui
      - name: Upload report and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-latest
          - macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Rust toolchain
        shell: bash
        run: rustup update stable && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          cache-bin: false

      - name: Linux build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config patchelf \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev xvfb

      - name: Install
        run: npm ci

      - name: Build debug binary
        run: npm run build:debug

      - name: Start Xvfb
        if: runner.os == 'Linux'
        run: |
          nohup Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          for _ in $(seq 1 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
          [ -S /tmp/.X11-unix/X99 ] || { cat "$RUNNER_TEMP/xvfb.log"; exit 1; }
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Real-shell E2E (embedded WebDriver)
        env:
          RUST_BACKTRACE: "1"
          NO_AT_BRIDGE: "1"
        run: npm run test:e2e

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}
          path: artifacts/e2e
          if-no-files-found: warn
          retention-days: 7

  sheet:
    name: contact sheet
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-*
          path: shots
      - run: node scripts/contact-sheet.mjs shots contact-sheet.html
      - uses: actions/upload-artifact@v7
        with:
          name: contact-sheet
          path: contact-sheet.html
          retention-days: 14
