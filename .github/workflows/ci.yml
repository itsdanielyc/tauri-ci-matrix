# Layer 1 of the spike: build the debug binary and run the real-shell (L6)
# WebdriverIO suite on all six free GitHub-hosted runners, including macOS
# through the embedded WebDriver provider. Each job uploads the screenshot the
# suite takes, named after the OS and CPU architecture the app reported.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-latest
          - macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Rust toolchain
        shell: bash
        run: rustup update stable && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          cache-bin: false

      - name: Linux build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config patchelf \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev xvfb

      - name: Install
        run: npm ci

      - name: Build debug binary
        run: npm run build:debug

      - name: Start Xvfb
        if: runner.os == 'Linux'
        run: |
          nohup Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          for _ in $(seq 1 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
          [ -S /tmp/.X11-unix/X99 ] || { cat "$RUNNER_TEMP/xvfb.log"; exit 1; }
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Real-shell E2E (embedded WebDriver)
        env:
          RUST_BACKTRACE: "1"
          NO_AT_BRIDGE: "1"
        run: npm run test:e2e

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}
          path: artifacts/e2e
          if-no-files-found: warn
          retention-days: 7
